name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag commit is on main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag commit must already be merged into main." >&2
            exit 1
          }
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: sh -n start.sh k12-baglantisini-ac.sh K12-Baglantisini-Ac.command
      - run: npm run audit:release
      - run: npm run release:verify -- "$GITHUB_REF_NAME"
      - name: Build tracked-source archives
        run: |
          mkdir release
          git archive --format=zip --prefix="egitim-pusulasi-${GITHUB_REF_NAME}/" --output="release/egitim-pusulasi-${GITHUB_REF_NAME}.zip" HEAD
          git archive --format=tar.gz --prefix="egitim-pusulasi-${GITHUB_REF_NAME}/" --output="release/egitim-pusulasi-${GITHUB_REF_NAME}.tar.gz" HEAD
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Eğitim Pusulası $GITHUB_REF_NAME"
