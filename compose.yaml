services:
  egitim-pusulasi:
    build: .
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - egitim-pusulasi-data:/data
    environment:
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_REDACT: ${AI_REDACT:-true}
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  egitim-pusulasi-data:
